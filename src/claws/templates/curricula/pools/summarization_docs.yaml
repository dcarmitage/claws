scenarios:
  - |
    Title: "The Case for Incremental Architecture in Software Systems"

    Modern software teams face a persistent tension between designing for the future and
    shipping for the present. The traditional approach — spending weeks on architecture
    before writing production code — assumes we can predict requirements accurately. But
    evidence from large-scale projects at companies like Spotify, Netflix, and Stripe
    suggests otherwise: teams that over-invest in upfront architecture are 2.3x more
    likely to require major rewrites within 18 months.

    Incremental architecture proposes an alternative: build the simplest thing that works,
    instrument it heavily, and let real usage data guide structural decisions. This does
    not mean "no architecture" — it means deferring irreversible decisions until you have
    evidence. The key discipline is maintaining clean boundaries so that when you do
    restructure, the blast radius is contained.

    Critics argue this leads to technical debt. The data tells a different story. Teams
    practicing incremental architecture report 40% less unplanned rework compared to
    upfront-design teams, primarily because they make fewer wrong bets about future
    requirements. The debt they do accumulate is intentional and well-documented, unlike
    the hidden structural assumptions baked into speculative architectures.
  - |
    Title: "Why Most AI Evaluation Benchmarks Are Misleading"

    The AI research community relies heavily on benchmarks to measure progress: MMLU for
    general knowledge, HumanEval for code generation, GPQA for graduate-level reasoning.
    These benchmarks serve an important coordination function — they give the field common
    yardsticks. But they also create systematic blind spots that distort our understanding
    of model capabilities.

    The core problem is Goodhart's Law: when a measure becomes a target, it ceases to be
    a good measure. Models are increasingly trained with benchmark performance as an
    explicit or implicit objective. This does not mean they "cheat" — but training on
    distributions similar to benchmark distributions inflates scores without proportional
    improvement in real-world capability. A model scoring 90% on MMLU may still fail at
    tasks requiring the same knowledge applied in unfamiliar contexts.

    More fundamentally, benchmarks test isolated capabilities in controlled conditions.
    Real-world AI use involves composing capabilities under uncertainty: understanding an
    ambiguous request, planning a multi-step approach, executing it, recognizing when the
    approach is failing, and adapting. No major benchmark tests this full loop.

    The solution is not to abandon benchmarks but to supplement them with ecologically
    valid evaluations — tasks drawn from actual use cases, scored by domain experts, with
    performance measured over sustained interaction rather than single-turn responses.
