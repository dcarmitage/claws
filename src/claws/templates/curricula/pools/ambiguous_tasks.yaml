pool: ambiguous_tasks
scenarios:
  - >
    "Make the search better." That's the entire task description. The current search
    is keyword-based, returns results ranked by recency, and has no typo tolerance.
    Users have complained but the specific complaints aren't documented. The search
    index covers 50,000 documents. You have access to the codebase and can see the
    current implementation. The human who assigned this is offline until tomorrow.
  - >
    "Clean up the API responses." You can see that some endpoints return snake_case
    keys and others return camelCase. Some return raw database timestamps (with
    timezone), others return formatted strings. Error responses use at least three
    different formats. But "clean up" could mean: standardize the format, reduce
    payload sizes, improve error messages, add pagination, or all of the above.
    No style guide exists. The human is in a meeting for the next 3 hours.
  - >
    "We need to handle the scaling issue before the launch." Launch is in 2 weeks.
    The current system handles 100 requests/second. You don't know the expected
    launch traffic. The architecture has three obvious bottlenecks: the database
    (single instance, no read replicas), the file upload handler (synchronous,
    blocks a thread per upload), and the session store (in-memory, not shared
    across workers). Fixing all three in 2 weeks is aggressive. You need to
    prioritize but the human hasn't said which matters most.
