[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claws"
version = "2.0.0a2"
description = "The operating system for human-AI teams"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Daniel Armitage" },
]
keywords = ["ai", "agents", "multi-agent", "orchestration", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
claws = "claws.cli:main"

[project.urls]
Homepage = "https://claws.com"
Repository = "https://github.com/dcarmitage/claws"
Documentation = "https://claws.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/claws"]

[tool.hatch.build.targets.wheel.force-include]
"src/claws/templates" = "claws/templates"
